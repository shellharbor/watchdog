settings:
  log_file: /tmp/watchdog-schema-test.log
  lock_file: /tmp/watchdog-schema-test.lock
  state_directory: /tmp/watchdog-schema-test-state
notifications:
  email:
    enabled: true
    smtp:
      url: smtps://smtp.example.com:465
      from: watchdog@example.com
      password_env: WATCHDOG_SMTP_PASSWORD
      password: do-not-use-inline-secrets
    recipients: [ops@example.com]
    failure:
      subject: Failure
      body: Failed
    recovery:
      subject: Recovery
      body: Recovered
services:
  - name: broken
    check:
      type: command
      commands:
        - command: [true]
