name: Release metadata

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify version, CLI, documentation, and tag
        shell: bash
        run: bash ./scripts/release-preflight.sh "${GITHUB_REF_NAME}"
