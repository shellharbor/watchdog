name: Signed release artifacts

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-signing-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  sign:
    if: github.repository == 'shellharbor/watchdog'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Validate release metadata and package committed sources
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          bash scripts/release-preflight.sh "$RELEASE_TAG"
          python scripts/package-release.py --tag "$RELEASE_TAG" --output-dir "$RUNNER_TEMP/release-artifacts"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign, verify, and upload without replacing existing assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/sign-release.sh "$RUNNER_TEMP/release-artifacts" "$RELEASE_TAG"
