name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck sqlite3

      - name: Install yq v4
        env:
          YQ_VERSION: v4.47.2
        run: |
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install CI-only schema validator
        run: python -m pip install 'jsonschema>=4.19,<5'

      - name: Check generated single-file distribution
        run: bash ./scripts/build-watchdog.sh --check

      - name: Check Bash syntax
        run: bash -n service-watchdog.sh watchdog-discover.sh install.sh scripts/build-watchdog.sh lib/watchdog/*.sh tests/*.sh

      - name: Check Bash 4.3 syntax compatibility
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            bash:4.3.48 \
            bash -c '[[ "$BASH_VERSION" == 4.3.* ]] && bash -n service-watchdog.sh watchdog-discover.sh install.sh scripts/build-watchdog.sh lib/watchdog/*.sh tests/*.sh'

      - name: Run ShellCheck
        # The generated script is the complete program. Linting individual
        # library fragments would incorrectly flag globals used by another fragment.
        run: shellcheck service-watchdog.sh watchdog-discover.sh install.sh scripts/build-watchdog.sh tests/*.sh

      - name: Run full regression suite
        run: bash ./tests/run-all.sh
