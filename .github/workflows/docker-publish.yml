name: Publish Watchdog container images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z Git tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      revision: ${{ steps.version.outputs.revision }}
      stable: ${{ steps.version.outputs.stable }}
      dockerhub_enabled: ${{ steps.version.outputs.dockerhub_enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - id: version
        name: Verify tag and VERSION
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease || false }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "${RELEASE_TAG}" == "v${version}" ]]
          [[ "${version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          {
            printf 'version=%s\n' "${version}"
            printf 'major=%s\n' "${BASH_REMATCH[1]}"
            printf 'minor=%s\n' "${BASH_REMATCH[2]}"
            printf 'revision=%s\n' "$(git rev-parse HEAD)"
            if [[ "${RELEASE_PRERELEASE}" == true ]]; then
              printf '%s\n' 'stable=false'
            else
              printf '%s\n' 'stable=true'
            fi
            if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
              printf '%s\n' 'dockerhub_enabled=true'
            else
              printf '%s\n' 'dockerhub_enabled=false'
            fi
          } >> "${GITHUB_OUTPUT}"

  publish-ghcr:
    name: Publish GHCR images
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: runtime-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.major }}.${{ needs.prepare.outputs.minor }}
            type=raw,value=${{ needs.prepare.outputs.major }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.stable == 'true' }}

      - name: Build and publish runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.runtime-meta.outputs.tags }}
          labels: ${{ steps.runtime-meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.revision }}
          provenance: mode=max
          sbom: true

      - id: docker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}-docker
            type=raw,value=${{ needs.prepare.outputs.major }}.${{ needs.prepare.outputs.minor }}-docker
            type=raw,value=${{ needs.prepare.outputs.major }}-docker
            type=raw,value=latest-docker,enable=${{ needs.prepare.outputs.stable == 'true' }}

      - name: Build and publish Docker CLI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.revision }}
          provenance: mode=max
          sbom: true

  publish-dockerhub:
    name: Publish Docker Hub images
    needs: prepare
    if: ${{ needs.prepare.outputs.dockerhub_enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: runtime-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/watchdog
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.major }}.${{ needs.prepare.outputs.minor }}
            type=raw,value=${{ needs.prepare.outputs.major }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.stable == 'true' }}

      - name: Build and publish runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.runtime-meta.outputs.tags }}
          labels: ${{ steps.runtime-meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.revision }}
          provenance: mode=max
          sbom: true

      - id: docker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/watchdog
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}-docker
            type=raw,value=${{ needs.prepare.outputs.major }}.${{ needs.prepare.outputs.minor }}-docker
            type=raw,value=${{ needs.prepare.outputs.major }}-docker
            type=raw,value=latest-docker,enable=${{ needs.prepare.outputs.stable == 'true' }}

      - name: Build and publish Docker CLI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.revision }}
          provenance: mode=max
          sbom: true
