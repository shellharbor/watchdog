# yaml-language-server: $schema=https://raw.githubusercontent.com/shellharbor/watchdog/main/schema/watchdog.schema.json
# Replace the paths, URL and service name for your installation, then set
# WATCHDOG_TG_BOT_TOKEN in the systemd environment file or scheduler.
settings:
  log_file: /var/log/service-watchdog/service-watchdog.log
  lock_file: /run/lock/service-watchdog.lock
  state_directory: /var/lib/service-watchdog

notifications:
  webhooks:
    telegram:
      enabled: true
      bot_token_env: WATCHDOG_TG_BOT_TOKEN
      chat_id: "-1001234567890"
      # thread_id: "42"
      template:
        failure: "🚨 <b>{{service}}</b> недоступен\n\nПроверка: {{check_type}}\nДетали: {{detail}}\nВремя: {{timestamp}}"
        recovery: "✅ <b>{{service}}</b> снова доступен\n\nВремя: {{timestamp}}"

services:
  - name: telegram-demo
    check:
      type: http
      url: https://example.com/health
